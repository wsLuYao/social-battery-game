  <title id="title">你的社交电池，电量还剩几格？</title>
  <desc id="desc">米黄色底色上的像素电池与校园夜色，介绍一款探索社交节奏的网页小游戏。</desc>
  <rect width="1440" height="420" rx="20" fill="#ece2bf"/>
