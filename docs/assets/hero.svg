    <text x="67" y="164" font-size="56" font-weight="700">你的社交电池</text>
    <text x="67" y="238" font-size="56" font-weight="700">电量还剩几格？</text>
    <text x="71" y="294" font-size="22" fill="#697452">用 5—10 分钟，走过属于你的这一晚。</text>
    <text x="71" y="377" font-size="17" fill="#4c6042">校园聚会  /  从容离场  /  宿舍充电  /  今晚的充电小票</text>
